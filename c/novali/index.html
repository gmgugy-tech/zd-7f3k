html,body{margin:0}







.cell{cursor:pointer;transition:filter .12s,box-shadow .12s}
.cell:hover,.cell:focus-visible{filter:brightness(1.06);box-shadow:0 0 0 4px rgba(27,42,74,.35);outline:none}
.num{font-weight:700;font-size:54.2px}



.hwc{display:inline-block;min-width:1.6em;padding:0 .35em;border-radius:1em;background:rgba(255,255,255,.25);font-size:.85em;line-height:1.45}
.btn.hw{background:linear-gradient(135deg,var(--hw-orange),var(--hw-purple));color:var(--white);border-color:transparent}
.tile .hwt{display:block;margin:0 8px 2px;padding:3px 8px;border-radius:10px;background:var(--hw-tint);color:var(--hw-purple-dk);font-size:11.5px;font-weight:700;width:fit-content;max-width:calc(100% - 16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .hwn{display:block;margin:0 8px 4px;font-size:11px;color:var(--hw-brown);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.panel.hwp .mh{background:linear-gradient(100deg,var(--hw-g1) 0%,var(--hw-purple-dk) 55%,var(--hw-g3) 100%)}
.sec h3 .hwg{color:var(--hw-purple)}

/* UI layers (unscaled) */
.ui{font:13px/1.4 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,"DejaVu Sans",sans-serif;color:var(--tx)}
#tip{position:fixed;z-index:5;display:none;pointer-events:none;background:var(--ink);color:var(--white);border-radius:8px;padding:8px 11px;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:300px}
#tip b{display:block;font-size:13px}#tip span{font-size:12px;opacity:.9}#tip i{display:block;font-size:11px;opacity:.7;margin-top:3px;font-style:normal}
.overlay{position:fixed;inset:0;background:rgba(15,22,38,.55);display:none;z-index:20}
.overlay.open{display:flex;align-items:center;justify-content:center}
#modal .panel{width:min(1400px,94vw);height:90vh;background:var(--surface2);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.mh{background:var(--ink);color:var(--white);padding:12px 18px;display:flex;align-items:center;gap:12px;flex:none}
.mh .t{flex:1;min-width:0}.mh .t b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mh .t span{font-size:12.5px;opacity:.85}
.btn{border:0;border-radius:8px;padding:7px 12px;font:600 13px "Inter",system-ui,sans-serif;cursor:pointer;background:var(--surface);color:var(--tx)}
.btn.ghost{background:rgba(255,255,255,.14);color:var(--white)}.btn.ghost:hover{background:rgba(255,255,255,.25)}
.btn.warn{background:var(--neg);color:var(--white)}
.x{background:none;border:0;color:var(--white);font-size:26px;line-height:1;cursor:pointer;padding:0 4px}
.mb{flex:1;overflow:auto;padding:6px 18px 24px;overscroll-behavior:contain}
.sec{margin-top:14px}.sec h3{margin:0 0 2px;font-size:15px;line-height:1.35}.sec .sm{font-size:12px;color:var(--tx2);margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.tile{background:var(--surface);border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(27,42,74,.12);position:relative;display:flex;flex-direction:column}
.tile .im{position:relative;aspect-ratio:4/5;background:var(--media);cursor:zoom-in;overflow:hidden}
.tile img{width:100%;height:100%;object-fit:contain;display:block}
.play{position:absolute;left:8px;bottom:8px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center}
.play{pointer-events:none;transition:opacity .15s}.im.playing .play{opacity:0}
.tile video.tv{width:100%;height:100%;object-fit:contain;display:block;background:var(--media)}
.vbtn{position:absolute;bottom:8px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:var(--white);font-size:15px;line-height:1;cursor:pointer;z-index:2;display:flex;align-items:center;justify-content:center;padding:0}
.vbtn:hover{background:rgba(0,0,0,.8)}.mute{right:8px}.exp{right:46px}
.im.nov .vbtn{display:none}
#lbv{max-width:100%;max-height:100%;background:var(--lb-bg)}
@media (max-width:699px){.vbtn{width:40px;height:40px;font-size:18px}.exp{right:54px}.play{width:36px;height:36px}}
.play:after{content:"";border-left:11px solid var(--white);border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:3px}
.star{position:absolute;right:6px;top:6px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.92);box-shadow:0 1px 4px rgba(0,0,0,.25);cursor:pointer;font-size:20px;line-height:34px;color:var(--st-grey);padding:0;z-index:2}
.star.on{color:var(--star-on)}.star:hover{transform:scale(1.08)}
.tm{padding:7px 9px 8px;font-size:11.5px;color:var(--tx2);display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.tm a{color:var(--link);text-decoration:none;font-variant-numeric:tabular-nums}.tm a:hover{text-decoration:underline}
.lab{width:100%;font-weight:600;color:var(--tx);font-size:11.5px}
.pill{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:9px;color:var(--white)}.act{background:var(--st-green)}.ina{background:var(--st-grey)}
.more{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 14px;font:600 12.5px "Inter",system-ui,sans-serif;cursor:pointer;color:var(--tx)}
.none{padding:40px;text-align:center;color:var(--tx2);font-size:15px;font-weight:600}
/* LED status light */
.led{position:absolute;left:8px;top:8px;width:12px;height:12px;border-radius:50%;z-index:2;pointer-events:auto}
.led.on{background:var(--led-on);box-shadow:0 0 0 2px var(--white),0 0 8px 3px rgba(34,197,94,.75);animation:ledpulse 2.2s ease-in-out infinite}
.led.off{background:var(--led-off);box-shadow:0 0 0 2px var(--white),0 0 8px 3px rgba(239,68,68,.65)}
@keyframes ledpulse{0%,100%{box-shadow:0 0 0 2px var(--white),0 0 6px 2px rgba(34,197,94,.55)}50%{box-shadow:0 0 0 2px var(--white),0 0 12px 5px rgba(34,197,94,.95)}}
@media (prefers-reduced-motion:reduce){.led.on{animation:none}}
#lb .li .led{left:14px;top:14px;width:14px;height:14px}
@media (max-width:699px){.led{width:14px;height:14px}#lb .li .led{width:16px;height:16px}}
.rate .hid{display:none;font-size:10.5px;color:var(--tx3);align-items:center;gap:5px}
.rate .hid .q{display:inline-flex;gap:1px}.rate .hid .q svg{width:13px;height:13px;fill:var(--q-fill);stroke:var(--q-edge);stroke-width:1.4}
body.sh .rate:not(.rev) .stars,body.sh .rate:not(.rev) .rl,body.sh .rate:not(.rev)+.rr,body.sh .sp{display:none}
body.sh .rate:not(.rev) .hid{display:inline-flex;cursor:pointer}body:not(.sh) .spn{display:none}
.btn.spd{background:var(--surface);color:var(--tx)}.btn.spd .s{color:var(--gold)}

:root{--font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--font-display:"Plus Jakarta Sans","Inter",sans-serif;--font-serif-italic:"Newsreader",Georgia,serif;--bg:#F4F5F0;--bg-main:radial-gradient(120% 90% at 0% 0%,#F6F8EE 0%,#F7F8F4 45%,#EFF0EC 100%);--border-main:#F1F2EC;--glow:radial-gradient(60% 40% at 50% 75%,rgba(194,237,63,.10),transparent 70%);--side:#FFFFFF;--surface:#FFFFFF;--surface2:#FAFAFA;--subtle:#FCFCFC;--hover:#F4F5F7;--line2:#EEF1F3;--line-hover:#DDE2E6;--tx:#232323;--tx2:#5E5E5E;--blue:#1E8DF8;--blue-bg:#EAF3FE;--accent:#C2ED3F;--accent-tx:#000000;--accent-soft:rgba(194,237,63,.22);--accent-line:rgba(145,170,68,.55);--proven:#C2ED3F;--proven-tx:#000000;--pos:#00B80F;--pos-bg:#EEFAF0;--neg:#FF3000;--neg-bg:#FEEFEC;--total:#FAFAFA;--heat-lo:#E7E7E7;--heat-hi:#29282E;--heat-inv:#FFFFFF;--tip-bg:linear-gradient(180deg,#4B4B4B,#353535);--tip-tx:#FFFFFF;--shadow:0 1px 2px rgba(16,24,40,.04);--shadow-tip:0 8px 24px rgba(0,0,0,.18);--shadow-lg:0 18px 40px -12px rgba(0,0,0,.28);--sbf:#000000;--sbf-tx2:#ACACAB;--nav-hover:#F4F5F0;--nav-press:#ECEFE4;--shadow-active:0 2px 8px rgba(0,0,0,.06);--media:#F0F0F0;--overlay:rgba(20,22,16,.40);--gH-bg:#EEFAF0;--gH:#00960C;--gM-bg:#FFF4DB;--gM:#B45309;--gL-bg:#FEEFEC;--gL:#E02A00;--sw-min:64px}
[data-theme=dark]{--bg:#10110B;--bg-main:radial-gradient(120% 90% at 30% 20%,#1F2117 0%,#181A10 35%,#0F100B 70%,#090908 100%);--border-main:#151611;--glow:radial-gradient(60% 45% at 70% 85%,rgba(194,237,63,.08),transparent 70%);--side:#000000;--tx:#EDEDED;--blue:#3B9BFF;--blue-bg:rgba(59,155,255,.14);--accent-soft:rgba(194,237,63,.10);--accent-line:rgba(194,237,63,.35);--pos:#22C55E;--pos-bg:rgba(34,197,94,.14);--neg:#FF5A36;--neg-bg:rgba(255,90,54,.14);--heat-hi:#F2F2F2;--tip-bg:linear-gradient(180deg,#F2F2F2,#DCDCDC);--shadow-tip:0 8px 24px rgba(0,0,0,.5);--shadow-lg:0 18px 40px -12px rgba(0,0,0,.7);--sbf:#2F2F2E;--nav-hover:#141414;--nav-press:#1C1C1C;--shadow-active:0 2px 10px rgba(194,237,63,.15);--overlay:rgba(0,0,0,.6);--gH-bg:rgba(34,197,94,.14);--gH:#22C55E;--gM-bg:rgba(251,191,36,.14);--gM:#FBBF24;--gL-bg:rgba(255,90,54,.14);--gL:#FF5A36}
body,button,input,select,textarea,.ui,#mob{font-family:var(--font)}
.num,.kv,.csv,.cstv,.acs .num{font-feature-settings:"tnum" 1}
/* Norde frame: sidebar flush left + inset main panel (radius 16, 1px border, tinted gradient + lime glow) */
@media (min-width:700px){html,body{background:var(--side)}
 body::before{content:"";position:fixed;left:var(--sw);top:10px;right:10px;bottom:10px;border-radius:16px;background:var(--glow),var(--bg-main);border:1px solid var(--border-main);z-index:-1;pointer-events:none;transition:left .2s ease}
 body.sbmin::before{left:var(--sw-min)}
 #modal{left:var(--sw)!important}body.sbmin #modal{left:var(--sw-min)!important}}
@media (max-width:699px){html,body{background:var(--bg-main) fixed,var(--bg)}}
/* headline: Plus Jakarta Sans 400, tight tracking, gradient text; Newsreader italic accent */
.st-ttl{font:400 66px/0.93 var(--font-display);letter-spacing:-.045em;background:var(--headline-grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding:6px 0 10px}
.st-ttl em,#mob h1 em{font-family:var(--font-serif-italic);font-style:italic;font-weight:400;letter-spacing:-.02em}
.st-sub{font-size:22px;color:var(--tx2)}
#mob h1{font:400 30px/1 var(--font-display);letter-spacing:-.045em;background:var(--headline-grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding:2px 0 4px}
/* NexaDash cards (stage px = spec px × ~1.86 at the default fit) */
.mcard,#cwstrip,.calcard{background:var(--surface);border:2px solid var(--line);border-radius:19px;box-shadow:var(--shadow)}
.ctitle,#cwstrip .cwhd b,.calhd b{font-size:26px;font-weight:600;letter-spacing:0;text-transform:uppercase;color:var(--tx2)}
.ctitle .ic,#cwstrip .cwhd b .ic,.calhd b .ic,.kh .ic{color:var(--tx2)}
.ic{stroke-width:1.5}
/* KPI tile: two layers (outer #FAFAFA shell + header strip, inner white card) */
.kpi{background:var(--surface2);border:2px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:0;gap:0;display:flex;flex-direction:column}
.kh{font-size:24px;font-weight:600;letter-spacing:0;text-transform:uppercase;color:var(--tx2);padding:16px 22px 14px;gap:12px}
.kh .karr{border:0;width:auto;height:auto;margin-left:auto;color:var(--tx);background:none}
.kin{flex:1;margin:0 8px 8px;background:var(--surface);border:2px solid var(--line);border-radius:19px;padding:14px 22px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.kv{font-size:58px;font-weight:700;letter-spacing:-.02em;line-height:1.05;color:var(--tx)}
.kp{font-size:22px;font-weight:600;border-radius:999px;padding:6px 16px;background:var(--subtle);border:2px solid var(--line);color:var(--tx2)}.kp.pos{background:var(--pos-bg);color:var(--pos);border-color:transparent}.kp.acc{background:var(--accent);color:var(--accent-tx);border-color:transparent}
.kclick:hover,.kclick:focus-visible{border-color:var(--line-hover);box-shadow:var(--shadow-raised)}
/* matrix cells = NexaDash heat cells */

.sw{border-radius:5px}.sw-e{border:2px solid var(--line);opacity:1;background:var(--surface)}
.cell:hover,.cell:focus-visible{box-shadow:0 0 0 3px var(--tx),var(--shadow-raised)}
.mleg{color:var(--tx2)}
/* tooltip (NexaDash dark gradient; inverted in dark) */
#tip{background:var(--tip-bg);color:var(--tip-tx);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow-tip);border:0}
#tip b{font-size:15px;font-weight:500}#tip span,#tip i{color:var(--tip-tx2);opacity:1;font-size:13.5px}
#why{border-radius:10px;box-shadow:var(--shadow-tip);border:1px solid var(--line)}
/* controls: 34px, #FCFCFC, 1px border, radius 7 */
.btn,.btn.ghost,.btn.spd,.sortsel,.more{background:var(--subtle);border:1px solid var(--line);border-radius:7px;min-height:34px;font-size:14px;color:var(--tx);transition:background .15s,border-color .15s}
.btn:hover,.btn.ghost:hover,.sortsel:hover,.more:hover{background:var(--hover);border-color:var(--line-hover)}
.btn:focus-visible,.sortsel:focus-visible,.more:focus-visible,.whyb:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(30,141,248,.25)}

[data-theme=dark]{--shadow:inset 0 1px 0 rgba(255,255,255,.06);--shadow-raised:inset 0 1px 0 rgba(255,255,255,.10),0 0 0 1px var(--line-hover);--shadow-raised-1x:inset 0 1px 0 rgba(255,255,255,.10),0 0 0 1px var(--line-hover)}

.btn[aria-busy=true],.btn.is-loading{position:relative;color:transparent!important;pointer-events:none}
.btn[aria-busy=true]::after,.btn.is-loading::after{content:"";position:absolute;inset:0;margin:auto;width:14px;height:14px;border-radius:50%;border:2px solid var(--tx3);border-top-color:var(--tx);animation:zspin .7s linear infinite}
